<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f4f0" />
    <title>捡手机</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(async (registrations) => {
          const stale = registrations.filter((r) => r.scope.includes("/FoundPhone-Studio/"));
          if (!stale.length) return;
          await Promise.all(stale.map((r) => r.unregister()));
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter((k) => k.includes("workbox") || k.includes("precache")).map((k) => caches.delete(k)));
          }
          if (navigator.serviceWorker.controller && !sessionStorage.getItem("foundphone-cache-reset-v2")) {
            sessionStorage.setItem("foundphone-cache-reset-v2", "1");
            location.reload();
          }
        }).catch(() => {});
      }
    </script>
    <script type="module" src="/src/runtime/StoryPlayer.tsx"></script>
  </body>
</html>
